<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tasks — QuickJoin</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>✅</text></svg>">
  <link rel="stylesheet" href="/assets/style.css">
</head>
<body>
  <div class="wrap">
    <a class="back" href="/">← Back to QuickJoin</a>
    <h1 class="page-title">✅ Tasks</h1>
    <p class="sub">Simple list. Check it off, move on.</p>
    <div class="card">
      <form class="row" id="add-form">
        <input type="text" id="task-input" placeholder="Add a task…" autocomplete="off">
        <button type="submit">Add</button>
      </form>
      <ul class="plain" id="task-list"></ul>
      <p class="empty" id="empty-msg">Nothing here yet — add your first task above.</p>
      <div class="row" style="margin-top:14px">
        <button class="secondary" id="clear-done" type="button">Clear completed</button>
        <span class="hint" id="count" style="align-self:center"></span>
      </div>
      <p class="hint">Tasks save in this browser.</p>
    </div>
  </div>
  <script>
    var KEY = 'qj-tasks';
    function load() { try { return JSON.parse(localStorage.getItem(KEY)) || []; } catch (e) { return []; } }
    function save(tasks) { localStorage.setItem(KEY, JSON.stringify(tasks)); }
    var list = document.getElementById('task-list');
    var emptyMsg = document.getElementById('empty-msg');
    var count = document.getElementById('count');
    function render() {
      var tasks = load();
      list.innerHTML = '';
      emptyMsg.style.display = tasks.length ? 'none' : 'block';
      var open = 0;
      tasks.forEach(function (t, i) {
        if (!t.done) open++;
        var li = document.createElement('li');
        if (t.done) li.className = 'done';
        var cb = document.createElement('input');
        cb.type = 'checkbox'; cb.checked = !!t.done;
        cb.addEventListener('change', function () {
          var ts = load(); ts[i].done = cb.checked; save(ts); render();
        });
        var span = document.createElement('span');
        span.textContent = t.text;
        var x = document.createElement('button');
        x.className = 'x'; x.textContent = '✕'; x.setAttribute('aria-label', 'Delete task');
        x.addEventListener('click', function () {
          var ts = load(); ts.splice(i, 1); save(ts); render();
        });
        li.appendChild(cb); li.appendChild(span); li.appendChild(x);
        list.appendChild(li);
      });
      count.textContent = tasks.length ? open + ' to go' : '';
    }
    document.getElementById('add-form').addEventListener('submit', function (e) {
      e.preventDefault();
      var input = document.getElementById('task-input');
      var text = input.value.trim();
      if (!text) return;
      var tasks = load(); tasks.push({ text: text, done: false }); save(tasks);
      input.value = ''; render();
    });
    document.getElementById('clear-done').addEventListener('click', function () {
      save(load().filter(function (t) { return !t.done; })); render();
    });
    render();
  </script>
</body>
</html>
